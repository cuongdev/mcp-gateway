<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Gateway — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js" crossorigin></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12',950:'#431407' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.3s ease-out; }
    @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  </style>
</head>
<body class="h-full dark">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    const { useState, useEffect, useCallback, useMemo, createContext, useContext } = React;
    const { AreaChart, Area, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;

    // ════════════════════════════════════════════════════════
    // API Client
    // ════════════════════════════════════════════════════════
    const API_BASE = '/api';

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        credentials: 'same-origin',
        ...options,
      });
      if (res.status === 401) {
        // Session expired — reload to trigger login check
        window.__authState?.setUser(null);
        return null;
      }
      if (!res.ok) throw new Error(`API error: ${res.status}`);
      return res.json();
    }

    async function authApi(path, options = {}) {
      const res = await fetch(`/auth${path}`, {
        headers: { 'Content-Type': 'application/json', ...options.headers },
        credentials: 'same-origin',
        ...options,
      });
      if (!res.ok) throw new Error(`Auth API error: ${res.status}`);
      return res.json();
    }

    // ════════════════════════════════════════════════════════
    // Auth Context
    // ════════════════════════════════════════════════════════
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(undefined); // undefined = loading
      const [providers, setProviders] = useState([]);

      useEffect(() => {
        // Load providers list (always public)
        fetch('/auth/providers', { credentials: 'same-origin' })
          .then(r => r.json())
          .then(d => setProviders(d.providers ?? []))
          .catch(() => setProviders([]));

        // Check current session
        fetch('/auth/me', { credentials: 'same-origin' })
          .then(r => r.json())
          .then(d => setUser(d.authenticated ? d.user : null))
          .catch(() => setUser(null));
      }, []);

      const logout = async () => {
        await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' });
        setUser(null);
      };

      const ctx = { user, setUser, providers, logout };
      window.__authState = ctx;
      return <AuthContext.Provider value={ctx}>{children}</AuthContext.Provider>;
    }

    const useAuth = () => useContext(AuthContext);

    // ════════════════════════════════════════════════════════
    // Login Page
    // ════════════════════════════════════════════════════════
    function LoginPage() {
      const { providers } = useAuth();
      const urlParams = new URLSearchParams(window.location.search);
      const authError = urlParams.get('auth_error');

      const providerIcons = {
        google: '🔵',
        github: '⚫',
        azure: '🟦',
        azure_ad: '🟦',
        okta: '🔷',
        auth0: '⚪',
        keycloak: '🔴',
        default: '🔐',
      };

      return (
        <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
          <div className="w-full max-w-md">
            {/* Logo */}
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-16 h-16 bg-brand-500/10 rounded-2xl border border-brand-500/20 mb-4">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f97316" strokeWidth="2">
                  <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
              </div>
              <h1 className="text-2xl font-bold text-white">MCP Gateway</h1>
              <p className="text-gray-400 mt-1 text-sm">Admin Dashboard</p>
            </div>

            {/* Error */}
            {authError && (
              <div className="mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm text-center">
                Login failed: {decodeURIComponent(authError)}
              </div>
            )}

            <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
              {providers.length === 0 ? (
                /* Development mode — no OIDC */
                <div className="text-center">
                  <div className="text-gray-400 text-sm mb-4">
                    Running in <span className="text-brand-400 font-medium">development mode</span> — no authentication required
                  </div>
                  <button
                    onClick={() => window.__authState?.setUser({ sub: 'dev', email: 'dev@local', name: 'Developer', roles: ['admin'], issuer: 'dev' })}
                    className="w-full py-3 px-4 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-lg transition-colors"
                  >
                    Enter as Admin (Dev Mode)
                  </button>
                </div>
              ) : (
                /* Enterprise mode — OIDC providers */
                <div>
                  <p className="text-gray-400 text-sm text-center mb-4">Sign in with your identity provider</p>
                  <div className="space-y-3">
                    {providers.map(p => (
                      <a
                        key={p.id}
                        href={p.loginUrl}
                        className="flex items-center gap-3 w-full py-3 px-4 bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-gray-600 text-white rounded-lg transition-all group"
                      >
                        <span className="text-xl">{providerIcons[p.id] ?? providerIcons.default}</span>
                        <span className="font-medium flex-1">Continue with {p.name}</span>
                        <svg className="w-4 h-4 text-gray-500 group-hover:text-gray-300 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                        </svg>
                      </a>
                    ))}
                  </div>
                </div>
              )}
            </div>

            <p className="text-center text-gray-600 text-xs mt-6">
              MCP Gateway — Access controlled by your organization
            </p>
          </div>
        </div>
      );
    }

    // ════════════════════════════════════════════════════════
    // Icons (inline SVG — no dependency needed)
    // ════════════════════════════════════════════════════════
    const Icon = ({ name, size = 20, className = '' }) => {
      const icons = {
        home: <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1" />,
        server: <path d="M5 12H3m18 0h-2M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-7-4h.01M17 16h.01" />,
        tool: <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
        grid: <path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />,
        shield: <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        key: <path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />,
        log: <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />,
        chart: <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />,
        settings: <path d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />,
        plus: <path d="M12 4v16m8-8H4" />,
        refresh: <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />,
        trash: <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        check: <path d="M5 13l4 4L19 7" />,
        x: <path d="M6 18L18 6M6 6l12 12" />,
        search: <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        eye: <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />,
        link: <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />,
        users: <path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
        zap: <path d="M13 10V3L4 14h7v7l9-11h-7z" />,
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name]}
        </svg>
      );
    };

    // ════════════════════════════════════════════════════════
    // Shared Components
    // ════════════════════════════════════════════════════════

    const Badge = ({ children, color = 'gray' }) => {
      const colors = {
        green: 'bg-green-500/10 text-green-400 border-green-500/20',
        red: 'bg-red-500/10 text-red-400 border-red-500/20',
        yellow: 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20',
        blue: 'bg-blue-500/10 text-blue-400 border-blue-500/20',
        orange: 'bg-brand-500/10 text-brand-400 border-brand-500/20',
        gray: 'bg-gray-500/10 text-gray-400 border-gray-500/20',
      };
      return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${colors[color]}`}>{children}</span>;
    };

    const Card = ({ children, className = '' }) => (
      <div className={`bg-gray-900 border border-gray-800 rounded-xl p-6 ${className}`}>{children}</div>
    );

    const StatCard = ({ label, value, icon, trend, color = 'brand' }) => (
      <Card>
        <div className="flex items-center justify-between">
          <div>
            <p className="text-sm text-gray-400">{label}</p>
            <p className="mt-1 text-3xl font-bold text-white">{value}</p>
            {trend && <p className={`mt-1 text-xs ${trend > 0 ? 'text-green-400' : 'text-red-400'}`}>{trend > 0 ? '+' : ''}{trend}% from last hour</p>}
          </div>
          <div className={`p-3 rounded-lg bg-${color}-500/10`}>
            <Icon name={icon} size={24} className={`text-${color}-400`} />
          </div>
        </div>
      </Card>
    );

    const Button = ({ children, onClick, variant = 'primary', size = 'md', icon, disabled }) => {
      const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500/50 disabled:opacity-50';
      const variants = {
        primary: 'bg-brand-600 hover:bg-brand-700 text-white',
        secondary: 'bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700',
        danger: 'bg-red-600/10 hover:bg-red-600/20 text-red-400 border border-red-500/20',
        ghost: 'hover:bg-gray-800 text-gray-400',
      };
      const sizes = { sm: 'px-3 py-1.5 text-xs gap-1.5', md: 'px-4 py-2 text-sm gap-2', lg: 'px-6 py-3 text-base gap-2' };
      return (
        <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${sizes[size]}`}>
          {icon && <Icon name={icon} size={size === 'sm' ? 14 : 16} />}
          {children}
        </button>
      );
    };

    const Input = ({ label, value, onChange, placeholder, type = 'text' }) => (
      <div>
        {label && <label className="block text-sm font-medium text-gray-400 mb-1.5">{label}</label>}
        <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
          className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 text-sm" />
      </div>
    );

    const Modal = ({ open, onClose, title, children }) => {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
          <div className="relative bg-gray-900 border border-gray-800 rounded-xl shadow-2xl w-full max-w-lg max-h-[80vh] overflow-auto animate-fadeIn">
            <div className="flex items-center justify-between p-6 border-b border-gray-800">
              <h3 className="text-lg font-semibold text-white">{title}</h3>
              <button onClick={onClose} className="text-gray-400 hover:text-white"><Icon name="x" size={20} /></button>
            </div>
            <div className="p-6">{children}</div>
          </div>
        </div>
      );
    };

    const Table = ({ columns, data, onRowClick }) => (
      <div className="overflow-x-auto">
        <table className="w-full">
          <thead>
            <tr className="border-b border-gray-800">
              {columns.map(col => (
                <th key={col.key} className="px-4 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">{col.label}</th>
              ))}
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-800/50">
            {data.map((row, i) => (
              <tr key={i} onClick={() => onRowClick?.(row)} className={`${onRowClick ? 'cursor-pointer hover:bg-gray-800/50' : ''} transition-colors`}>
                {columns.map(col => (
                  <td key={col.key} className="px-4 py-3 text-sm text-gray-300">{col.render ? col.render(row) : row[col.key]}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
        {data.length === 0 && <div className="py-12 text-center text-gray-500">No data</div>}
      </div>
    );

    const Toggle = ({ enabled, onChange, label }) => (
      <div className="flex items-center gap-3">
        <button onClick={() => onChange(!enabled)}
          className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${enabled ? 'bg-brand-600' : 'bg-gray-700'}`}>
          <span className={`inline-block h-4 w-4 rounded-full bg-white transform transition-transform ${enabled ? 'translate-x-6' : 'translate-x-1'}`} />
        </button>
        {label && <span className="text-sm text-gray-300">{label}</span>}
      </div>
    );

    // ════════════════════════════════════════════════════════
    // Page: Overview / Dashboard
    // ════════════════════════════════════════════════════════
    const OverviewPage = () => {
      const [stats, setStats] = useState({ servers: 0, tools: 0, groups: 0, requests: 0 });
      const [servers, setServers] = useState([]);
      const [recentLogs, setRecentLogs] = useState([]);

      useEffect(() => {
        Promise.all([
          api('/servers').catch(() => ({ servers: [] })),
          api('/tools').catch(() => ({ tools: [], total: 0 })),
          api('/groups').catch(() => ({ groups: [] })),
        ]).then(([s, t, g]) => {
          setStats({ servers: s.servers?.length || 0, tools: t.total || 0, groups: g.groups?.length || 0, requests: 1247 });
          setServers(s.servers || []);
        });
      }, []);

      const chartData = Array.from({ length: 24 }, (_, i) => ({
        hour: `${i}:00`, requests: Math.floor(Math.random() * 200 + 50), errors: Math.floor(Math.random() * 10),
      }));

      const toolUsage = [
        { name: 'query_data', value: 342 }, { name: 'read_file', value: 256 },
        { name: 'search', value: 189 }, { name: 'get_report', value: 145 }, { name: 'other', value: 98 },
      ];
      const COLORS = ['#f97316', '#3b82f6', '#22c55e', '#eab308', '#6b7280'];

      return (
        <div className="animate-fadeIn space-y-6">
          <div>
            <h1 className="text-2xl font-bold text-white">Dashboard</h1>
            <p className="text-gray-400 mt-1">Overview of your MCP Gateway</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <StatCard label="MCP Servers" value={stats.servers} icon="server" color="brand" />
            <StatCard label="Registered Tools" value={stats.tools} icon="tool" color="blue" />
            <StatCard label="Tool Groups" value={stats.groups} icon="grid" color="green" />
            <StatCard label="Requests (24h)" value={stats.requests.toLocaleString()} icon="zap" trend={12} color="yellow" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <Card className="lg:col-span-2">
              <h3 className="text-sm font-medium text-gray-400 mb-4">Request Volume (24h)</h3>
              <ResponsiveContainer width="100%" height={240}>
                <AreaChart data={chartData}>
                  <defs>
                    <linearGradient id="colorReq" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="5%" stopColor="#f97316" stopOpacity={0.3} />
                      <stop offset="95%" stopColor="#f97316" stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" />
                  <XAxis dataKey="hour" stroke="#6b7280" tick={{ fontSize: 11 }} />
                  <YAxis stroke="#6b7280" tick={{ fontSize: 11 }} />
                  <Tooltip contentStyle={{ backgroundColor: '#111827', border: '1px solid #374151', borderRadius: 8 }} />
                  <Area type="monotone" dataKey="requests" stroke="#f97316" fill="url(#colorReq)" strokeWidth={2} />
                  <Area type="monotone" dataKey="errors" stroke="#ef4444" fill="none" strokeWidth={1.5} strokeDasharray="4 4" />
                </AreaChart>
              </ResponsiveContainer>
            </Card>

            <Card>
              <h3 className="text-sm font-medium text-gray-400 mb-4">Top Tools</h3>
              <ResponsiveContainer width="100%" height={200}>
                <PieChart>
                  <Pie data={toolUsage} cx="50%" cy="50%" innerRadius={50} outerRadius={80} paddingAngle={3} dataKey="value">
                    {toolUsage.map((_, i) => <Cell key={i} fill={COLORS[i % COLORS.length]} />)}
                  </Pie>
                  <Tooltip contentStyle={{ backgroundColor: '#111827', border: '1px solid #374151', borderRadius: 8 }} />
                </PieChart>
              </ResponsiveContainer>
              <div className="mt-2 space-y-1">
                {toolUsage.map((t, i) => (
                  <div key={t.name} className="flex items-center justify-between text-xs">
                    <div className="flex items-center gap-2">
                      <div className="w-2 h-2 rounded-full" style={{ backgroundColor: COLORS[i] }} />
                      <span className="text-gray-400">{t.name}</span>
                    </div>
                    <span className="text-gray-300 font-medium">{t.value}</span>
                  </div>
                ))}
              </div>
            </Card>
          </div>

          <Card>

    const ServersPage = () => {
      const [servers, setServers] = useState([]);
      const [showAdd, setShowAdd] = useState(false);
      const [form, setForm] = useState({ name: '', url: '', type: 'streamable-http', bearerToken: '', command: '', args: '', stateful: false });
      const [loading, setLoading] = useState(false);

      const load = () => api('/servers').then(d => setServers(d.servers || [])).catch(() => {});
      useEffect(() => { load(); }, []);

      const addServer = async () => {
        setLoading(true);
        try {
          const transport = form.type === 'stdio'
            ? { type: 'stdio', command: form.command, args: form.args.split(' ').filter(Boolean), stateful: form.stateful }
            : { type: form.type, url: form.url, ...(form.bearerToken && { bearerToken: form.bearerToken }), timeout: 30000 };
          await api('/servers', { method: 'POST', body: JSON.stringify({ name: form.name, transport }) });
          setShowAdd(false);
          setForm({ name: '', url: '', type: 'streamable-http', bearerToken: '', command: '', args: '', stateful: false });
          load();
        } catch (e) { alert('Failed: ' + e.message); }
        setLoading(false);
      };

      const removeServer = async (name) => {
        if (!confirm(`Remove server "${name}"?`)) return;
        await api(`/servers/${name}`, { method: 'DELETE' });
        load();
      };

      const syncServer = async (name) => {
        await api(`/servers/${name}/sync`, { method: 'POST' });
        load();
      };

      return (
        <div className="animate-fadeIn space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-bold text-white">MCP Servers</h1>

            <Button icon="plus" onClick={() => setShowAdd(true)}>Add Server</Button>

                  <div>
                    <h3 className="text-white font-semibold">{s.name}</h3>
                    <p className="text-xs text-gray-500 mt-0.5">{s.tools?.length || 0} tools registered</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <Button variant="ghost" size="sm" icon="refresh" onClick={() => syncServer(s.name)}>Sync</Button>
                  <Button variant="danger" size="sm" icon="trash" onClick={() => removeServer(s.name)}>Remove</Button>
                </div>
              </Card>
            ))}
            {servers.length === 0 && (
              <Card className="text-center py-12">
                <Icon name="server" size={40} className="text-gray-600 mx-auto mb-3" />
                <p className="text-gray-400">No servers registered</p>
                <Button className="mt-4" icon="plus" onClick={() => setShowAdd(true)}>Add your first server</Button>
              </Card>
            )}
          </div>

          <Modal open={showAdd} onClose={() => setShowAdd(false)} title="Register MCP Server">
            <div className="space-y-4">
              <Input label="Server Name" value={form.name} onChange={v => setForm({ ...form, name: v })} placeholder="my-server" />
              <div>
                <label className="block text-sm font-medium text-gray-400 mb-1.5">Transport</label>
                <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })}
                  className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/50">
                  <option value="streamable-http">Streamable HTTP</option>
                  <option value="sse">SSE</option>
                  <option value="stdio">STDIO</option>
                </select>
              </div>
              {form.type !== 'stdio' ? (
                <>
                  <Input label="Server URL" value={form.url} onChange={v => setForm({ ...form, url: v })} placeholder="http://localhost:8001/mcp" />
                  <Input label="Bearer Token (optional)" value={form.bearerToken} onChange={v => setForm({ ...form, bearerToken: v })} placeholder="your-secret-token" />
                </>
              ) : (
                <>
                  <Input label="Command" value={form.command} onChange={v => setForm({ ...form, command: v })} placeholder="node" />
                  <Input label="Arguments" value={form.args} onChange={v => setForm({ ...form, args: v })} placeholder="./my-server.js --port 8001" />
                  <Toggle enabled={form.stateful} onChange={v => setForm({ ...form, stateful: v })} label="Stateful (keep process alive)" />
                </>
              )}
              <div className="flex justify-end gap-3 pt-2">
                <Button variant="secondary" onClick={() => setShowAdd(false)}>Cancel</Button>
                <Button onClick={addServer} disabled={loading || !form.name}>{loading ? 'Registering...' : 'Register Server'}</Button>
              </div>
            </div>
          </Modal>
        </div>
      );
    };

    };

    // ════════════════════════════════════════════════════════
    // Page: Metrics & Charts
    // ════════════════════════════════════════════════════════
    const MetricsPage = () => {
      const latencyData = Array.from({ length: 30 }, (_, i) => ({
        time: `${i}m`, p50: Math.random() * 100 + 20, p95: Math.random() * 300 + 100, p99: Math.random() * 500 + 200,
      }));

      const errorData = Array.from({ length: 24 }, (_, i) => ({
        hour: `${i}:00`, auth_errors: Math.floor(Math.random() * 5), authz_errors: Math.floor(Math.random() * 8), upstream_errors: Math.floor(Math.random() * 3),
      }));

      return (
        <div className="animate-fadeIn space-y-6">
          <div>
            <h1 className="text-2xl font-bold text-white">Metrics & Monitoring</h1>
            <p className="text-gray-400 mt-1">Real-time gateway performance metrics</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
            <StatCard label="Avg Latency" value="87ms" icon="zap" color="brand" />
            <StatCard label="Error Rate" value="0.3%" icon="x" color="red" />
            <StatCard label="Auth Failures" value="12" icon="shield" trend={-8} color="yellow" />
            <StatCard label="Uptime" value="99.9%" icon="check" color="green" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <Card>
              <h3 className="text-sm font-medium text-gray-400 mb-4">Response Latency (30min)</h3>
              <ResponsiveContainer width="100%" height={240}>
                <AreaChart data={latencyData}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" />
                  <XAxis dataKey="time" stroke="#6b7280" tick={{ fontSize: 11 }} />
                  <YAxis stroke="#6b7280" tick={{ fontSize: 11 }} unit="ms" />
                  <Tooltip contentStyle={{ backgroundColor: '#111827', border: '1px solid #374151', borderRadius: 8 }} />
                  <Area type="monotone" dataKey="p99" stroke="#ef4444" fill="none" strokeDasharray="4 4" strokeWidth={1} />
                  <Area type="monotone" dataKey="p95" stroke="#eab308" fill="none" strokeWidth={1.5} />
                  <Area type="monotone" dataKey="p50" stroke="#22c55e" fill="none" strokeWidth={2} />
                </AreaChart>
              </ResponsiveContainer>
              <div className="flex gap-4 mt-2 justify-center text-xs">
                <span className="flex items-center gap-1"><span className="w-3 h-0.5 bg-green-500 inline-block" /> p50</span>
                <span className="flex items-center gap-1"><span className="w-3 h-0.5 bg-yellow-500 inline-block" /> p95</span>
                <span className="flex items-center gap-1"><span className="w-3 h-0.5 bg-red-500 inline-block border-dashed" /> p99</span>
              </div>
            </Card>

            <Card>
              <h3 className="text-sm font-medium text-gray-400 mb-4">Errors by Type (24h)</h3>
              <ResponsiveContainer width="100%" height={260}>
                <BarChart data={errorData}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#1f2937" />
                  <XAxis dataKey="hour" stroke="#6b7280" tick={{ fontSize: 11 }} />
                  <YAxis stroke="#6b7280" tick={{ fontSize: 11 }} />
                  <Tooltip contentStyle={{ backgroundColor: '#111827', border: '1px solid #374151', borderRadius: 8 }} />
                  <Bar dataKey="auth_errors" stackId="a" fill="#f97316" radius={[0, 0, 0, 0]} />
                  <Bar dataKey="authz_errors" stackId="a" fill="#eab308" />
                  <Bar dataKey="upstream_errors" stackId="a" fill="#ef4444" radius={[4, 4, 0, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </Card>
          </div>

          <Card>
            <div className="flex items-center justify-between mb-2">
              <h3 className="text-sm font-medium text-gray-400">Prometheus Endpoint</h3>
              <Badge color="green">Active</Badge>
            </div>
            <code className="text-xs text-gray-400 bg-gray-800 rounded px-3 py-2 block">GET /api/metrics</code>
          </Card>
        </div>
      );
    };

    // ════════════════════════════════════════════════════════
    // Page: Settings
    // ════════════════════════════════════════════════════════
    const SettingsPage = () => {
      const [mode, setMode] = useState('development');
      const [settings, setSettings] = useState({
        port: '3000', host: '0.0.0.0', mcpPath: '/mcp', apiPath: '/api',
        auditEnabled: true, auditStorage: 'file', metricsEnabled: true, corsOrigins: '*',
      });

      return (
        <div className="animate-fadeIn space-y-6">
          <div>
            <h1 className="text-2xl font-bold text-white">Settings</h1>
            <p className="text-gray-400 mt-1">General gateway configuration</p>
          </div>

          <Card>
            <h3 className="text-white font-medium mb-4">Gateway Mode</h3>
            <div className="grid grid-cols-2 gap-4">
              {[
                { id: 'development', label: 'Development', desc: 'No auth, full access, console logging' },
                { id: 'enterprise', label: 'Enterprise', desc: 'OIDC required, strict ACL, file audit' },
              ].map(m => (
                <button key={m.id} onClick={() => setMode(m.id)}
                  className={`p-4 rounded-lg border-2 text-left transition-colors ${mode === m.id ? 'border-brand-500 bg-brand-500/5' : 'border-gray-800 bg-gray-900 hover:border-gray-700'}`}>
                  <div className="flex items-center gap-2">
                    <div className={`w-3 h-3 rounded-full ${mode === m.id ? 'bg-brand-500' : 'bg-gray-600'}`} />
                    <span className="text-white font-medium">{m.label}</span>
                  </div>
                  <p className="text-gray-400 text-sm mt-1">{m.desc}</p>
                </button>
              ))}
            </div>
          </Card>

          <Card>
            <h3 className="text-white font-medium mb-4">Network</h3>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              <Input label="Port" value={settings.port} onChange={v => setSettings({ ...settings, port: v })} />
              <Input label="Host" value={settings.host} onChange={v => setSettings({ ...settings, host: v })} />
              <Input label="MCP Path" value={settings.mcpPath} onChange={v => setSettings({ ...settings, mcpPath: v })} />
              <Input label="API Path" value={settings.apiPath} onChange={v => setSettings({ ...settings, apiPath: v })} />
            </div>
            <div className="mt-4">
              <Input label="CORS Origins (comma-separated)" value={settings.corsOrigins} onChange={v => setSettings({ ...settings, corsOrigins: v })} />
            </div>
          </Card>

          <Card>
            <h3 className="text-white font-medium mb-4">Features</h3>
            <div className="space-y-4">
              <Toggle enabled={settings.auditEnabled} onChange={v => setSettings({ ...settings, auditEnabled: v })} label="Audit Logging" />
              <Toggle enabled={settings.metricsEnabled} onChange={v => setSettings({ ...settings, metricsEnabled: v })} label="Prometheus Metrics" />
            </div>
          </Card>

          <div className="flex justify-end">
            <Button>Save Settings</Button>
          </div>
        </div>
      );
    };

    // ════════════════════════════════════════════════════════
    // Layout: Sidebar + Content
    // ════════════════════════════════════════════════════════
    const navItems = [
      { id: 'overview', label: 'Dashboard', icon: 'home' },
      { id: 'servers', label: 'Servers', icon: 'server' },
      { id: 'tools', label: 'Tools', icon: 'tool' },
      { id: 'groups', label: 'Tool Groups', icon: 'grid' },
      { id: 'policies', label: 'Access Control', icon: 'shield' },
      { id: 'oidc', label: 'OIDC Config', icon: 'key' },
      { id: 'audit', label: 'Audit Logs', icon: 'log' },
      { id: 'metrics', label: 'Metrics', icon: 'chart' },
      { id: 'settings', label: 'Settings', icon: 'settings' },
    ];

    const pages = {
      overview: OverviewPage,
      servers: ServersPage,
      tools: ToolsPage,
      groups: GroupsPage,
      policies: PoliciesPage,
      oidc: OIDCPage,
      audit: AuditPage,
      metrics: MetricsPage,
      settings: SettingsPage,
    };

    function AppShell() {
      const { user, providers, logout } = useAuth();
      const [page, setPage] = useState('overview');
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const PageComponent = pages[page] || OverviewPage;

      // Loading state
      if (user === undefined) {
        return (
          <div className="min-h-screen bg-gray-950 flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-2 border-brand-500 border-t-transparent rounded-full animate-spin mx-auto mb-4" />
              <p className="text-gray-400 text-sm">Loading...</p>
            </div>
          </div>
        );
      }

      // Not authenticated → show login
      if (!user) return <LoginPage />;

      // User info for sidebar
      const isDevMode = providers.length === 0;

      return (
        <div className="flex h-screen bg-gray-950 text-gray-200">
          {/* Sidebar */}
          <aside className={`${sidebarOpen ? 'w-64' : 'w-16'} transition-all duration-300 bg-gray-900 border-r border-gray-800 flex flex-col`}>
            {/* Logo */}
            <div className="p-4 border-b border-gray-800 flex items-center gap-3">
              <div className="w-8 h-8 bg-brand-600 rounded-lg flex items-center justify-center font-bold text-white text-sm flex-shrink-0">D</div>
              {sidebarOpen && (
                <div>
                  <h2 className="text-white font-bold text-sm">MCP Gateway</h2>
                  <p className="text-gray-500 text-xs">MCP Proxy</p>
                </div>
              )}
            </div>

            {/* Nav */}
            <nav className="flex-1 p-3 space-y-1 overflow-y-auto scrollbar-thin">
              {navItems.map(item => (
                <button key={item.id} onClick={() => setPage(item.id)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                    page === item.id
                      ? 'bg-brand-600/10 text-brand-400'
                      : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                  }`}>
                  <Icon name={item.icon} size={18} className="flex-shrink-0" />
                  {sidebarOpen && <span>{item.label}</span>}
                </button>
              ))}
            </nav>

            {/* Footer */}
            <div className="p-3 border-t border-gray-800 space-y-2">
              {/* User info */}
              {sidebarOpen && (
                <div className="px-2 py-1.5">
                  <div className="text-xs font-medium text-gray-300 truncate">{user.name ?? user.email ?? user.sub}</div>
                  <div className="text-xs text-gray-500 truncate">{user.roles?.join(', ') || 'no roles'}</div>
                  {isDevMode && <div className="text-xs text-brand-500 mt-0.5">dev mode</div>}
                </div>
              )}
              {/* Logout */}
              {!isDevMode && (
                <button onClick={logout}
                  className="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg text-gray-500 hover:bg-gray-800 hover:text-red-400 transition-colors text-xs">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                  </svg>
                  {sidebarOpen && <span>Sign out</span>}
                </button>
              )}
              {/* Collapse toggle */}
              <button onClick={() => setSidebarOpen(!sidebarOpen)}
                className="w-full flex items-center justify-center p-1.5 rounded-lg text-gray-600 hover:bg-gray-800 hover:text-gray-400 transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                  {sidebarOpen ? <path d="M11 19l-7-7 7-7M18 19l-7-7 7-7" /> : <path d="M13 5l7 7-7 7M6 5l7 7-7 7" />}
                </svg>
              </button>
            </div>
          </aside>

          {/* Main Content */}
          <main className="flex-1 overflow-y-auto scrollbar-thin">
            <div className="max-w-7xl mx-auto p-8">
              <PageComponent />
            </div>
          </main>
        </div>
      );
    }

    const App = () => (
      <AuthProvider>
        <AppShell />
      </AuthProvider>
    );

    // ── Mount ────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
