name: 🐛 Bug Report
description: Report a problem with MCP Gateway
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! For **security vulnerabilities**, do not use this form — see [SECURITY.md](../security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Register server '...'
        2. Call tool '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.8.0 or commit sha"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [development, enterprise]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste gateway logs (redact any secrets).
      render: shell
