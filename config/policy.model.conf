# ============================================================
# Casbin RBAC Model with Role Hierarchy
# ============================================================
# This model supports:
# - RBAC: role-based access (admin, analyst, user, etc.)
# - Wildcard matching: tool:* matches all tools
# - Role hierarchy: admin inherits from analyst, etc.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
